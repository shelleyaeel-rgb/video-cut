name: Windows portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned application and build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Verify tag and prepare verified FFmpeg and model resources
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/build_windows.py --prepare-only --check-tag $env:GITHUB_REF_NAME
          } else {
            python scripts/build_windows.py --prepare-only
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test source application
        run: python -m unittest discover -s tests -v
      - name: Test frontend
        run: node --test tests/test_frontend.cjs
      - name: Build, verify frozen executable and package update
        run: python scripts/build_windows.py
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/FenghuoClip-*-windows-x64.zip
            dist/update-windows.json
            dist/self-test.json
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Stage release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "FenghuoClip $env:RELEASE_TAG" --notes "Windows x64 portable application. Extract the complete ZIP and run FenghuoClip.exe. Review third-party redistribution terms and smoke-test results before publishing."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
